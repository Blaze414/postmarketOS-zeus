# zeus is 1440x3200 on a 70x156mm panel - about 523 DPI. Unscaled, Phosh renders
# at roughly a quarter the physical size of a normal phone UI and is unusable.
#
# scale 3 gives 480x1066 logical pixels. cupid (1080x2400) runs scale 2 for
# 540x1200, so this is a slightly larger UI than its sibling; 2.667 would match
# cupid exactly, but integer scaling avoids fractional-scale blur and the extra
# compositor work, which matters more on a first port than pixel-perfect parity.
[cursor:seat0]
map-to-output = DSI-1

[output:DSI-1]
scale = 3
