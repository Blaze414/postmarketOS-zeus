# UCM for the Xiaomi 12 Pro (zeus).
#
# Without a profile matching this card, the sound server has no way to configure
# it and falls back to a Dummy Output - the card exists but nothing can play
# through it. alsa-lib looks this up as conf.d/<card driver>/<card name>.conf,
# which for this device is sm8450/Xiaomi-12.
#
# Modelled on Qualcomm's own SM8550-HDK profile: same ADSP audio architecture,
# same wcd938x codec and lpass macros. The HDK's WSA speaker sections are left
# out, because zeus drives four CS35L41 amps over tertiary TDM instead - a path
# the borrowed HDK topology does not describe at all.
Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sm8450/Zeus/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC1 Volume' 10"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
