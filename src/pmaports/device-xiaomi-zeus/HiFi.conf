SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"
	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"
	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"
	# The four CS35L41 amps on tertiary MI2S. The backend mixer is switched
	# here rather than in the verb so that selecting Headphones does not also
	# light up the speakers.
	#
	# "PCM Source" is set explicitly because its other setting, DSP, needs
	# Cirrus firmware that is not loaded here; ASP takes the ASPRX1 samples
	# straight to the class-H driver. Analog PCM Volume is the amp gain and
	# is deliberately left well below its maximum of 20 - there is no speaker
	# protection running without that same firmware.
	EnableSequence [
		cset "name='TERTIARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='BH PCM Source' ASP"
		cset "name='BL PCM Source' ASP"
		cset "name='TH PCM Source' ASP"
		cset "name='TL PCM Source' ASP"
		cset "name='BH Analog PCM Volume' 10"
		cset "name='BL Analog PCM Volume' 10"
		cset "name='TH Analog PCM Volume' 10"
		cset "name='TL Analog PCM Volume' 10"
	]
	DisableSequence [
		cset "name='TERTIARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		PlaybackChannels 2
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic1" {
	Comment "Top Microphone"
	Include.wcdmice.File "/codecs/wcd938x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/AnalogMic1DisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"
	Value {
		CaptureChannels 1
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
	}
}
